
name: Android build

"on":
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NEON BLOCKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-blocks-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_B64:-}" ] && \
             [ -n "${STORE_PASS:-}" ] && \
             [ -n "${KEY_ALIAS:-}" ] && \
             [ -n "${KEY_PASS:-}" ]; then

            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/neon-release.jks"

            {
              printf 'RELEASE_STORE_FILE=%s\n' "$RUNNER_TEMP/neon-release.jks"
              printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASS"
              printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
              printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASS"
            } >> "$GITHUB_ENV"

            echo "Release signing configured."
          else
            echo "Release signing secrets not configured."
          fi

      - name: Build release AAB
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: neon-blocks-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
