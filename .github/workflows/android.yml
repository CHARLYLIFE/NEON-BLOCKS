
name: Android build

"on":
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NEON BLOCKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK not found"
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and build APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-blocks-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          if [ -n "${KEYSTORE_B64:-}" ] && \
             [ -n "${STORE_PASS:-}" ] && \
             [ -n "${KEY_ALIAS:-}" ] && \
             [ -n "${KEY_PASS:-}" ]; then

            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/neon-release.jks"

            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/neon-release.jks"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASS"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"

            echo "Signing configured"
          else
            echo "Signing secrets not configured"
          fi

      - name: Build release AAB
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: neon-blocks-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
